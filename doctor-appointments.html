<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>السجلات الطبية - IDOS Hospital</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://unpkg.com/dexie@latest/dist/dexie.js"></script>
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --secondary: #06b6d4;
            --accent: #8b5cf6;
            --light: #f8fafc;
            --dark: #1e293b;
            --text: #334155;
            --text-light: #64748b;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            --transition: all 0.3s ease;
            --sidebar-width: 260px;
        }

        .dark-mode {
            --light: #0f172a;
            --dark: #f1f5f9;
            --text: #cbd5e1;
            --text-light: #94a3b8;
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Tajawal", "Segoe UI", sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 100%);
            transition: var(--transition);
        }

        body.dark-mode {
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
        }

        body.rtl {
            direction: rtl;
        }

        body.ltr {
            direction: ltr;
        }

        .dashboard-container {
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: var(--sidebar-width);
            background: linear-gradient(180deg, #1e3a5f 0%, #0f2b4a 100%);
            color: white;
            padding: 20px 0;
            box-shadow: var(--shadow);
            position: fixed;
            height: 100vh;
            overflow-y: auto;
            transition: var(--transition);
            z-index: 100;
        }

        body.rtl .sidebar {
            right: 0;
        }

        body.ltr .sidebar {
            left: 0;
        }

        body.rtl .main-content {
            margin-right: var(--sidebar-width);
        }

        body.ltr .main-content {
            margin-left: var(--sidebar-width);
            margin-right: 0;
        }

        .sidebar-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            margin-bottom: 20px;
        }

        .logo {
            width: 80px;
            height: 80px;
            background: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 15px;
        }

        .logo img {
            width: 60px;
            height: 60px;
            object-fit: contain;
        }

        .logo-text {
            font-size: 24px;
            font-weight: 800;
            background: linear-gradient(135deg, white, #93c5fd);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .user-info {
            text-align: center;
            margin-top: 10px;
        }

        .user-name {
            font-weight: bold;
            font-size: 18px;
            margin-bottom: 5px;
        }

        .user-type {
            background: rgba(255, 255, 255, 0.2);
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 12px;
            display: inline-block;
        }

        .sidebar-menu {
            list-style: none;
            padding: 0 15px;
            margin-bottom: 20px;
        }

        .menu-item {
            margin-bottom: 5px;
            border-radius: 10px;
            overflow: hidden;
        }

        .menu-item a {
            display: flex;
            align-items: center;
            padding: 12px 15px;
            color: white;
            text-decoration: none;
            transition: var(--transition);
            border-radius: 10px;
        }

        .menu-item a:hover,
        .menu-item.active a {
            background: rgba(255, 255, 255, 0.15);
        }

        body.rtl .menu-item a:hover {
            transform: translateX(-5px);
        }

        body.ltr .menu-item a:hover {
            transform: translateX(5px);
        }

        .menu-item i {
            font-size: 18px;
            width: 24px;
        }

        body.rtl .menu-item i {
            margin-left: 12px;
        }

        body.ltr .menu-item i {
            margin-right: 12px;
        }

        .menu-item span {
            flex: 1;
        }

        .main-content {
            flex: 1;
            padding: 20px;
            transition: var(--transition);
        }

        .header {
            background: white;
            border-radius: 20px;
            box-shadow: var(--shadow);
            padding: 20px 25px;
            margin-bottom: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: var(--transition);
        }

        body.dark-mode .header {
            background: var(--light);
        }

        .header h1 {
            color: var(--primary);
            font-size: 24px;
            font-weight: 700;
        }

        .header-actions {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .dark-mode-toggle,
        .logout-btn,
        .back-btn {
            padding: 10px 18px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            border: none;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
        }

        .dark-mode-toggle {
            background: rgba(37, 99, 235, 0.1);
            color: var(--primary);
        }

        .dark-mode-toggle:hover {
            background: rgba(37, 99, 235, 0.2);
        }

        .logout-btn {
            background: rgba(239, 68, 68, 0.1);
            color: var(--danger);
        }

        .logout-btn:hover {
            background: rgba(239, 68, 68, 0.2);
        }

        .back-btn {
            background: rgba(6, 182, 212, 0.1);
            color: var(--secondary);
        }

        .back-btn:hover {
            background: rgba(6, 182, 212, 0.2);
        }

        /* معلومات المريض */
        .patient-info-card {
            background: white;
            border-radius: 20px;
            box-shadow: var(--shadow);
            padding: 20px;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
            transition: var(--transition);
        }

        body.dark-mode .patient-info-card {
            background: var(--light);
        }

        .patient-avatar {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: bold;
            color: white;
        }

        /* نموذج إضافة سجل طبي */
        .form-card {
            background: white;
            border-radius: 20px;
            box-shadow: var(--shadow);
            padding: 25px;
            margin-bottom: 25px;
            transition: var(--transition);
        }

        body.dark-mode .form-card {
            background: var(--light);
        }

        .form-title {
            font-size: 18px;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--text);
            font-size: 13px;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 14px;
            background: #f8fafc;
            transition: var(--transition);
        }

        body.dark-mode .form-group input,
        body.dark-mode .form-group textarea,
        body.dark-mode .form-group select {
            background: rgba(255, 255, 255, 0.05);
            color: var(--dark);
            border-color: rgba(255, 255, 255, 0.1);
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--primary);
        }

        .btn-primary {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
        }

        .btn-primary:hover {
            background: var(--primary-dark);
        }

        /* قائمة السجلات الطبية */
        .records-list {
            background: white;
            border-radius: 20px;
            box-shadow: var(--shadow);
            padding: 20px;
            transition: var(--transition);
        }

        body.dark-mode .records-list {
            background: var(--light);
        }

        .record-item {
            padding: 15px;
            border-bottom: 1px solid #e2e8f0;
            cursor: pointer;
            transition: var(--transition);
        }

        body.dark-mode .record-item {
            border-bottom-color: rgba(255, 255, 255, 0.05);
        }

        .record-item:hover {
            background: rgba(37, 99, 235, 0.05);
            border-radius: 12px;
        }

        .record-title {
            font-weight: 700;
            color: var(--text);
            margin-bottom: 5px;
        }

        .record-date {
            font-size: 12px;
            color: var(--text-light);
        }

        @media (max-width: 992px) {
            .sidebar {
                width: 80px;
            }
            .sidebar-header .logo-text,
            .user-info,
            .menu-item span {
                display: none;
            }
            body.rtl .main-content {
                margin-right: 80px;
            }
            body.ltr .main-content {
                margin-left: 80px;
            }
            .menu-item a {
                justify-content: center;
                padding: 12px;
            }
            .menu-item i {
                margin: 0;
            }
        }

        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                gap: 15px;
                text-align: center;
            }
            .header-actions {
                justify-content: center;
            }
            .patient-info-card {
                justify-content: center;
                text-align: center;
            }
        }

        @media (max-width: 576px) {
            .main-content {
                padding: 15px;
            }
            .sidebar {
                width: 70px;
            }
            body.rtl .main-content {
                margin-right: 70px;
            }
            body.ltr .main-content {
                margin-left: 70px;
            }
        }
    </style>
</head>

<body class="rtl">
    <div class="dashboard-container">
        <div class="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <img src="logo.png" alt="IDOS Hospital" />
                </div>
                <div class="logo-text">IDOS</div>
                <div class="user-info">
                    <div class="user-name" id="userName">د. أحمد علي</div>
                    <div class="user-type">طبيب - أمراض القلب</div>
                </div>
            </div>

            <ul class="sidebar-menu">
                <li class="menu-item"><a href="doctor-dashboard.html"><i class="fas fa-th-large"></i><span>الرئيسية</span></a></li>
                <li class="menu-item"><a href="doctor-patients.html"><i class="fas fa-users"></i><span>مرضاي</span></a></li>
                <li class="menu-item active"><a href="doctor-appointments.html"><i class="fas fa-calendar-alt"></i><span>المواعيد</span></a></li>
                <li class="menu-item"><a href="doctor-medical-records.html"><i class="fas fa-file-medical"></i><span>السجلات الطبية</span></a></li>
                <li class="menu-item"><a href="doctor-messages.html"><i class="fas fa-comments"></i><span>الرسائل</span></a></li>
                <li class="menu-item"><a href="doctor-reports.html"><i class="fas fa-chart-line"></i><span>التقارير</span></a></li>
                <li class="menu-item"><a href="doctor-settings.html"><i class="fas fa-cog"></i><span>الإعدادات</span></a></li>
                <li class="menu-item"><a href="#" id="logoutBtnSidebar"><i class="fas fa-sign-out-alt"></i><span>تسجيل الخروج</span></a></li>
            </ul>
        </div>

        <div class="main-content">
            <div class="header">
                <h1><i class="fas fa-calendar-check"></i> مواعيد العيادة</h1>
                <div class="header-actions">
                    <button class="back-btn" onclick="window.location.href='doctor-dashboard.html'">
                        <i class="fas fa-arrow-right"></i> العودة
                    </button>
                    <button class="dark-mode-toggle" id="darkModeToggle">
                        <i class="fas fa-moon"></i>
                        <span>الوضع الداكن</span>
                    </button>
                    <button class="logout-btn" id="logoutBtn">
                        <i class="fas fa-sign-out-alt"></i>
                        <span>تسجيل الخروج</span>
                    </button>
                </div>
            </div>

            <!-- ملخص المواعيد -->
            <div class="stats-cards" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 25px;">
                <div class="stat-card" style="background: white; padding: 20px; border-radius: 20px; box-shadow: var(--shadow); display: flex; align-items: center; gap: 15px;">
                    <div style="width: 50px; height: 50px; background: rgba(37, 99, 235, 0.1); color: var(--primary); border-radius: 15px; display: flex; align-items: center; justify-content: center; font-size: 24px;">
                        <i class="fas fa-calendar-day"></i>
                    </div>
                    <div>
                        <div style="font-size: 14px; color: var(--text-light);">إجمالي المواعيد</div>
                        <div style="font-size: 20px; font-weight: 800;" id="totalApts">0</div>
                    </div>
                </div>
                <div class="stat-card" style="background: white; padding: 20px; border-radius: 20px; box-shadow: var(--shadow); display: flex; align-items: center; gap: 15px;">
                    <div style="width: 50px; height: 50px; background: rgba(16, 185, 129, 0.1); color: var(--success); border-radius: 15px; display: flex; align-items: center; justify-content: center; font-size: 24px;">
                        <i class="fas fa-check-circle"></i>
                    </div>
                    <div>
                        <div style="font-size: 14px; color: var(--text-light);">مواعيد مؤكدة</div>
                        <div style="font-size: 20px; font-weight: 800;" id="confirmedApts">0</div>
                    </div>
                </div>
                <div class="stat-card" style="background: white; padding: 20px; border-radius: 20px; box-shadow: var(--shadow); display: flex; align-items: center; gap: 15px;">
                    <div style="width: 50px; height: 50px; background: rgba(245, 158, 11, 0.1); color: var(--warning); border-radius: 15px; display: flex; align-items: center; justify-content: center; font-size: 24px;">
                        <i class="fas fa-clock"></i>
                    </div>
                    <div>
                        <div style="font-size: 14px; color: var(--text-light);">قيد الانتظار</div>
                        <div style="font-size: 20px; font-weight: 800;" id="pendingApts">0</div>
                    </div>
                </div>
            </div>

            <!-- قائمة المواعيد -->
            <div class="records-list" id="recordsList" style="background: white; padding: 25px; border-radius: 20px; box-shadow: var(--shadow);">
                <div class="form-title" style="margin-bottom: 20px; font-weight: 700; color: var(--primary); display: flex; align-items: center; gap: 10px;">
                    <i class="fas fa-list-alt"></i>
                    <span>جدول المواعيد</span>
                </div>
                <div id="recordsContainer">
                    <div style="text-align: center; padding: 40px; color: var(--text-light);">
                        <i class="fas fa-spinner fa-spin" style="font-size: 30px;"></i>
                        <p>جاري تحميل المواعيد...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- مودال عرض التفاصيل -->
    <div id="recordModal" class="modal-overlay" style="display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center;">
        <div style="background: white; border-radius: 20px; width: 90%; max-width: 600px; max-height: 85vh; overflow-y: auto;">
            <div style="padding: 20px 25px; border-bottom: 1px solid #e2e8f0; display: flex; justify-content: space-between; align-items: center;">
                <h3 style="color: var(--primary);">تفاصيل السجل الطبي</h3>
                <button onclick="closeRecordModal()" style="background: none; border: none; font-size: 24px; cursor: pointer;">&times;</button>
            </div>
            <div style="padding: 25px;" id="recordModalBody"></div>
            <div style="padding: 20px 25px; border-top: 1px solid #e2e8f0; display: flex; justify-content: flex-end; gap: 12px;">
                <button class="btn-primary" onclick="closeRecordModal()">إغلاق</button>
            </div>
        </div>
    </div>

    <style>
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        .modal-overlay.active {
            display: flex;
        }
        body.dark-mode .modal-overlay > div {
            background: var(--light);
            color: var(--dark);
        }
        .detail-row {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid #e2e8f0;
        }
        body.dark-mode .detail-row {
            border-bottom-color: rgba(255, 255, 255, 0.1);
        }
    </style>

    <script src="core.js"></script>
    <script>
        const currentUser = IDOS.currentUser;
        const currentLanguage = IDOS.currentLanguage;

        async function loadAppointments() {
            const container = document.getElementById("recordsContainer");
            
            try {
                const appointments = await IDOS.db.appointments
                    .where("doctorId")
                    .equals(currentUser.id)
                    .reverse()
                    .toArray();
                
                // تحديث الإحصائيات
                document.getElementById("totalApts").textContent = appointments.length;
                document.getElementById("confirmedApts").textContent = appointments.filter(a => a.status === 'confirmed').length;
                document.getElementById("pendingApts").textContent = appointments.filter(a => a.status === 'pending').length;

                if (appointments.length === 0) {
                    container.innerHTML = `
                        <div style="text-align: center; padding: 40px; color: var(--text-light);">
                            <i class="fas fa-calendar-times" style="font-size: 48px; opacity: 0.5; margin-bottom: 15px; display: block;"></i>
                            <p>${currentLanguage === 'ar' ? 'لا توجد مواعيد محجوزة حالياً' : 'No appointments booked yet'}</p>
                        </div>
                    `;
                    return;
                }
                
                let html = `
                    <table class="patients-table" style="width: 100%; border-collapse: collapse; margin-top: 10px; text-align: right;">
                        <thead>
                            <tr style="background: #f8fafc; border-bottom: 2px solid #e2e8f0;">
                                <th style="padding: 15px; font-weight: 700;">${currentLanguage === 'ar' ? 'اسم المريض' : 'Patient Name'}</th>
                                <th style="padding: 15px; font-weight: 700;">${currentLanguage === 'ar' ? 'التاريخ' : 'Date'}</th>
                                <th style="padding: 15px; font-weight: 700;">${currentLanguage === 'ar' ? 'الوقت' : 'Time'}</th>
                                <th style="padding: 15px; font-weight: 700;">${currentLanguage === 'ar' ? 'الحالة' : 'Status'}</th>
                                <th style="padding: 15px; font-weight: 700;">${currentLanguage === 'ar' ? 'الإجراءات' : 'Actions'}</th>
                            </tr>
                        </thead>
                        <tbody>
                `;
                
                appointments.forEach(apt => {
                    const statusColors = {
                        pending: "#f59e0b",
                        confirmed: "#10b981",
                        cancelled: "#ef4444",
                        completed: "#3b82f6"
                    };
                    const statusAr = {
                        pending: "بانتظار التأكيد",
                        confirmed: "مؤكد",
                        cancelled: "ملغي",
                        completed: "مكتمل"
                    };
                                      
                    html += `
                        <tr style="border-bottom: 1px solid #f1f5f9; transition: all 0.2s;" onmouseover="this.style.background='#fcfcfc'" onmouseout="this.style.background='transparent'">
                            <td style="padding: 15px;">
                                <div style="display: flex; align-items: center; gap: 10px;">
                                    <div style="width: 35px; height: 35px; background: #e0f2fe; color: #0369a1; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 14px;">
                                        ${apt.patientName ? apt.patientName.charAt(0) : 'P'}
                                    </div>
                                    <span style="font-weight: 600;">${apt.patientName || '---'}</span>
                                </div>
                            </td>
                            <td style="padding: 15px;">${apt.date}</td>
                            <td style="padding: 15px;">${apt.time}</td>
                            <td style="padding: 15px;">
                                <span class="status-badge" style="background: ${statusColors[apt.status]}15; color: ${statusColors[apt.status]}; padding: 6px 12px; border-radius: 12px; font-size: 12px; font-weight: 700; display: inline-flex; align-items: center; gap: 5px;">
                                    <span style="width: 6px; height: 6px; background: ${statusColors[apt.status]}; border-radius: 50%;"></span>
                                    ${currentLanguage === 'ar' ? statusAr[apt.status] : apt.status}
                                </span>
                            </td>
                            <td style="padding: 15px;">
                                <div style="display: flex; gap: 8px;">
                                    <button class="btn-primary" style="padding: 6px 12px; font-size: 12px; background: #3b82f6; border-radius: 10px;" title="${currentLanguage === 'ar' ? 'السجل الطبي' : 'Medical Records'}" onclick="viewPatient(${apt.patientId})">
                                        <i class="fas fa-file-medical"></i>
                                    </button>
                                    ${apt.status === "pending" ? `
                                        <button class="btn-primary" style="padding: 6px 12px; font-size: 12px; background: #10b981; border-radius: 10px;" title="${currentLanguage === 'ar' ? 'تأكيد' : 'Confirm'}" onclick="updateAptStatus(${apt.id}, 'confirmed')">
                                            <i class="fas fa-check"></i>
                                        </button>
                                        <button class="btn-primary" style="padding: 6px 12px; font-size: 12px; background: #ef4444; border-radius: 10px;" title="${currentLanguage === 'ar' ? 'إلغاء' : 'Cancel'}" onclick="updateAptStatus(${apt.id}, 'cancelled')">
                                            <i class="fas fa-times"></i>
                                        </button>
                                    ` : ''}
                                    ${apt.status === "confirmed" ? `
                                        <button class="btn-primary" style="padding: 6px 12px; font-size: 12px; background: #22c55e; border-radius: 10px;" title="${currentLanguage === 'ar' ? 'إتمام' : 'Complete'}" onclick="updateAptStatus(${apt.id}, 'completed')">
                                            <i class="fas fa-check-double"></i>
                                        </button>
                                    ` : ''}
                                </div>
                            </td>
                        </tr>
                    `;
                });
                
                html += `</tbody></table>`;
                container.innerHTML = html;
                
            } catch (err) {
                console.error("Error loading appointments:", err);
            }
        }

        async function updateAptStatus(id, status) {
            try {
                await IDOS.db.appointments.update(id, { status: status });
                IDOS.showToast("success", currentLanguage === 'ar' ? "تم تحديث حالة الموعد" : "Appointment status updated");
                loadAppointments();
            } catch (err) {
                console.error(err);
                IDOS.showToast("error", "Error updating status");
            }
        }

        function viewPatient(id) {
            window.location.href = `doctor-medical-records.html?patientId=${id}`;
        }

        // تهيئة الصفحة
        document.addEventListener("DOMContentLoaded", () => {
            if (!currentUser || currentUser.role !== "doctor") {
                window.location.href = "login.html";
                return;
            }

            // إضافة حدث تسجيل الخروج من القائمة الجانبية
            const logoutBtnSidebar = document.getElementById("logoutBtnSidebar");
            if (logoutBtnSidebar) {
                logoutBtnSidebar.addEventListener("click", (e) => {
                    e.preventDefault();
                    IDOS.logout();
                });
            }

            loadAppointments();
        });
    </script>
</body>
</html>
